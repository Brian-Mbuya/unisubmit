# Test profile configuration - always uses in-memory DB to avoid file locking issues
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  # This file fully replaces src/main/resources/application.yml on the test classpath
  # (same relative path, so nothing from it merges in) — spring.mail.host has to be
  # repeated here too, or Spring Boot never creates the JavaMailSender bean that
  # EmailService requires and every @SpringBootTest fails to start. username stays
  # unset, so EmailService still runs in log-only mode — no real SMTP is ever touched.
  mail:
    host: smtp.gmail.com
    port: 587
