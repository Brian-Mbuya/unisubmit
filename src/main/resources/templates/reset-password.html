<!DOCTYPE html>
<html th:replace="~{layout :: html(content=~{::div})}">
<body>
    <div class="auth-wrap">
        <!-- ── Brand panel (desktop only) ──────────────────────────────── -->
        <div class="auth-side">
            <img th:if="${schoolLogo != null}" th:src="${schoolLogo}" alt="" class="auth-mark" style="object-fit: contain;">
            <th:block th:if="${schoolLogo == null}"><svg th:replace="~{fragments/components :: brandMark('auth-mark')}"></svg></th:block>
            <h1>Almost there.</h1>
        </div>

        <!-- ── Code + new password card ────────────────────────────────── -->
        <div class="auth-card card">
            <div class="auth-head">
                <h1>Enter your reset code</h1>
                <p class="text-muted text-sm">
                    Lecturers and admins only. Students should use
                    <a th:href="@{/forgot-password}">the request form</a> and wait for an administrator.
                </p>
            </div>

            <div th:if="${param.sent}" class="alert alert-success">
                If that email is on file, a 6-digit code was just sent — it expires in 15 minutes.
            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">error</div>

            <form th:action="@{/reset-password}" method="post" data-loading-submit="Resetting…">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group">
                    <label class="form-label" for="resetIdentifier">Email</label>
                    <input type="text" name="identifier" id="resetIdentifier" class="form-control"
                           th:value="${formIdentifier}" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="resetCode">6-digit code</label>
                    <input type="text" name="code" id="resetCode" class="form-control"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="resetNewPassword">New password</label>
                    <input type="password" name="newPassword" id="resetNewPassword" class="form-control"
                           minlength="6" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="resetConfirmPassword">Confirm new password</label>
                    <input type="password" name="confirmPassword" id="resetConfirmPassword" class="form-control"
                           minlength="6" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-block mt-2">Reset password</button>
            </form>

            <p class="auth-foot text-sm text-muted">
                Need a new code? <a th:href="@{/forgot-password}">Request one again</a>
                <span class="text-subtle"> · </span>
                <a th:href="@{/login}">Back to sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
